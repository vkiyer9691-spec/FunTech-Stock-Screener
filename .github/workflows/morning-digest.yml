name: Morning stock-pick digest

# 08:30 Asia/Kolkata = 03:00 UTC. Indian cash market opens 09:15 IST.
on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      quick:
        description: "Use Nifty 50 + Next 50 fallback lists only (recommended for a test run)"
        type: boolean
        default: true
      to:
        description: "Also send to this email (even if nobody is opted in on Streamlit Cloud)"
        type: string
        required: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          set -euo pipefail
          ARGS=(--send --force-weekend)
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            ARGS+=(--quick)
          fi
          if [ -n "${{ github.event.inputs.to }}" ]; then
            ARGS+=(--to "${{ github.event.inputs.to }}")
          fi
          python run_daily_digest.py "${ARGS[@]}"
      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: morning-digest
          path: digest_outbox/
          if-no-files-found: ignore
